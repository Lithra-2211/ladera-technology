<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/lt-logo.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/lt-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Ladera Technology CRM" />
    <meta
      property="og:image"
      content="/ladera-logo.png"
    />
    <meta property="og:description" content="Ladera Technology CRM" />
    <meta property="og:title" content="Ladera Technology" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/ladera-logo.png"
    />

    <meta name="twitter:description" content="Ladera Technology CRM" />
    <meta name="twitter:title" content="Ladera Technology" />
    <title>Ladera Technology</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 16px; user-select: none;">
        <img src="/lt-logo.png" alt="Ladera Technology" style="width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);" />
        <div style="font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Ladera Technology</div>
        <div style="display: flex; align-items: center; gap: 8px; color: #2563eb; font-size: 13px; font-weight: 700; margin-top: 4px;">
          <div style="width: 14px; height: 14px; border: 2.5px solid rgba(37, 99, 235, 0.2); border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          <span>Loading CRM...</span>
        </div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
